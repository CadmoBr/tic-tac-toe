name: CI/CD - Tic Tac Toe

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite disparar manualmente pela interface do GitHub

jobs:
  test:
    name: CI - Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-test.txt

     # - name: Rodar Testes
      #  run: pytest

  build-and-push:
    name: CD - Build e push da imagem Docker
    runs-on: ubuntu-latest
    needs: test                                   # só roda se o job "test" passar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # a condição acima garante que Pull Requests NUNCA publicam imagem —
    # só um push direto na main dispara a publicação no Docker Hub
    envoriments: DOCKERHUB
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # lidos dos Secrets do repo,
          password: ${{ secrets.DOCKERHUB_TOKEN }}       # nunca do código-fonte

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tic-tac-toe:latest