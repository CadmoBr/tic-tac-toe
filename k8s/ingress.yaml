# Ingress para expor via URL (opcional)
# Para iniciantes: permite acesso via domínio em vez de IP/NodePort
# Requer controller de Ingress instalado no cluster (nginx, traefik, etc)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-toe-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: tic-tac-toe.local  # Substituir com domínio real
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tic-tac-toe-service
            port:
              number: 80
