# Service para expor o Deployment
# Para iniciantes: define como acessar os pods internamente ou externamente
apiVersion: v1
kind: Service
metadata:
  name: tic-tac-toe-service
spec:
  selector:
    app: tic-tac-toe
  ports:
  - protocol: TCP
    port: 80           # Porta do service
    targetPort: 8501   # Porta do container
  type: NodePort       # Alterar para LoadBalancer se necessário
